<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72">
  <defs>
    <clipPath id="logo-film-frame">
      <rect x="6" y="8" width="60" height="56" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Film Strip Icon with Costa Rica Flag Colors (1:1:2:1:1) -->
  <g clip-path="url(#logo-film-frame)">
    <rect x="6" y="8" width="60" height="11" fill="#002B7F"/>
    <rect x="6" y="19" width="60" height="6" fill="#FFFFFF"/>
    <rect x="6" y="25" width="60" height="22" fill="#CE1126"/>
    <rect x="6" y="47" width="60" height="6" fill="#FFFFFF"/>
    <rect x="6" y="53" width="60" height="11" fill="#002B7F"/>

    <!-- Subtle frame lines -->
    <line x1="22" y1="25" x2="22" y2="47" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="50" y1="25" x2="50" y2="47" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Center Play Icon -->
    <path d="M 32 30 C 32 29 33.2 28.3 34 29 L 43 35 C 44 35.6 44 36.8 43 37.4 L 34 43.4 C 33.2 44.1 32 43.4 32 42.4 Z" fill="#FFFFFF"/>

    <!-- Sprocket Holes Top -->
    <rect x="11" y="10.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="22" y="10.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="33" y="10.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="44" y="10.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="55" y="10.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>

    <!-- Sprocket Holes Bottom -->
    <rect x="11" y="55.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="22" y="55.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="33" y="55.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="44" y="55.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="55" y="55.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
  </g>
  <rect x="6" y="8" width="60" height="56" rx="12" ry="12" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>

  <!-- Brand Typography -->
  <text x="80" y="44" font-family="'Google Sans', 'Roboto', 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="currentColor" letter-spacing="-0.5">
    Cine<tspan fill="#CE1126">CR</tspan>
  </text>
  <text x="82" y="58" font-family="'Roboto', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2.5">
    COSTA RICA
  </text>
</svg>
