<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="film-frame">
      <rect x="4" y="6" width="92" height="88" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <!-- Main Film Strip Body with Costa Rica National Flag Colors (1:1:2:1:1) -->
  <g clip-path="url(#film-frame)">
    <!-- Top Blue Stripe -->
    <rect x="4" y="6" width="92" height="18" fill="#002B7F"/>
    
    <!-- Top White Stripe -->
    <rect x="4" y="24" width="92" height="9" fill="#FFFFFF"/>
    
    <!-- Center Red Stripe (Double Width) -->
    <rect x="4" y="33" width="92" height="34" fill="#CE1126"/>
    
    <!-- Bottom White Stripe -->
    <rect x="4" y="67" width="92" height="9" fill="#FFFFFF"/>
    
    <!-- Bottom Blue Stripe -->
    <rect x="4" y="76" width="92" height="18" fill="#002B7F"/>

    <!-- Subtle Film Frame Dividers in Center Red Section -->
    <line x1="28" y1="33" x2="28" y2="67" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="72" y1="33" x2="72" y2="67" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Cinema Play Triangle in Center -->
    <path d="M 44 42 C 44 40.5 45.6 39.5 47 40.3 L 61 48.5 C 62.3 49.3 62.3 51.2 61 52 L 47 60.2 C 45.6 61 44 60 44 58.5 Z" fill="#FFFFFF"/>

    <!-- Top Film Sprocket Holes (White) -->
    <rect x="12" y="10" width="10" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="29" y="10" width="10" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="45" y="10" width="10" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="61" y="10" width="10" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="78" y="10" width="10" height="10" rx="3" fill="#FFFFFF"/>

    <!-- Bottom Film Sprocket Holes (White) -->
    <rect x="12" y="80" width="10" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="29" y="80" width="10" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="45" y="80" width="10" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="61" y="80" width="10" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="78" y="80" width="10" height="10" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- Film Outline -->
  <rect x="4" y="6" width="92" height="88" rx="18" ry="18" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
</svg>
